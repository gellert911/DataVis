<!DOCTYPE html>
<html>
<head>
  <script src="https://cdn.jsdelivr.net/npm/vega@6.4.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@6.5.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@7.3.0"></script>
  <link href="./dist/output.css" rel="stylesheet">
  <title>DataVis</title>
</head>
<body>
  <h1 class="text-3xl font-bold">szia, vizualizacio!</h1>
  <div id="vis"/>
  <script>
    const spec = {
        "$schema": "https://vega.github.io/schema/vega-lite/v6.json",
        "description": "A simple bar chart with embedded data.",
        "data": {
            "values": [
            {"a": "A", "b": 28},
            {"a": "B", "b": 55},
            {"a": "C", "b": 43},
            {"a": "D", "b": 91},
            {"a": "E", "b": 81},
            {"a": "F", "b": 53},
            {"a": "G", "b": 19},
            {"a": "H", "b": 87},
            {"a": "I", "b": 52}
            ]
        },
        "mark": "bar",
        "encoding": {
            "x": {"field": "a", "type": "nominal", "axis": {"labelAngle": 0}},
            "y": {"field": "b", "type": "quantitative"}
        },
        "config": {}
        };
        vegaEmbed("#vis", spec, {mode: "vega-lite"}).then(console.log).catch(console.warn);
  </script>
</body>
</html>
