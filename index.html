<!DOCTYPE html>
<html data-theme="business">
<head>
  <script src="https://cdn.jsdelivr.net/npm/vega@6.4.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@6.5.0"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@7.3.0"></script>
  <link href="./dist/output.css" rel="stylesheet">
  <title>DataVis</title>
</head>
<body>

  <nav class="w-full bg-base-300 mb-3">
    <div class="navbar max-w-screen-3xl mx-auto px-4 flex justify-between items-center">
        <a class="btn btn-ghost text-xl">Adatvizualizáció</a>
        <span class="font-medium">Gellert</span>
    </div>
  </nav>

  <div class="max-w-screen-3xl mx-auto px-4">
    <h1 class="text-3xl font-bold mb-3">szia, vizualizacio!</h1>

    <div class="grid grid-rows-1 md:grid-rows-2 gap-3">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
        <div class="card bg-base-300 w-full h-full border-1 border-dashed border-base-content">
          <div class="card-body flex flex-col">
            <h2 class="card-title">Vizualizacio #1</h2>
            <div class="flex-1 flex items-center justify-center">
              <div id="vis"></div>
            </div>
          </div>
        </div>
        
        <div class="card bg-base-300 w-full h-full border-1 border-dashed border-base-content">
          <div class="card-body flex flex-col">
            <h2 class="card-title">Vizualizacio #2</h2>
            <div class="flex-1 flex items-center justify-center">
              <p class="m-0 text-center">Itt fog megjelenni a masodik vizualizacio :)</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script>
    const spec = {
        "$schema": "https://vega.github.io/schema/vega-lite/v6.json",
        "description": "A simple bar chart with embedded data.",
        "data": {
            "values": [
            {"a": "A", "b": 28},
            {"a": "B", "b": 55},
            {"a": "C", "b": 43},
            {"a": "D", "b": 91},
            {"a": "E", "b": 81},
            {"a": "F", "b": 53},
            {"a": "G", "b": 19},
            {"a": "H", "b": 87},
            {"a": "I", "b": 52}
            ]
        },
        "mark": "bar",
        "encoding": {
            "x": {"field": "a", "type": "nominal", "axis": {"labelAngle": 0}},
            "y": {"field": "b", "type": "quantitative"}
        },
        "config": {}
        };
        vegaEmbed("#vis", spec, {mode: "vega-lite"}).then(console.log).catch(console.warn);
  </script>
</body>
</html>
